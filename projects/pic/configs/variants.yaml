# Method variants compared by the benchmark. Each entry is merged on top of the
# shared protocol and the file of the record. The default variant changes
# nothing: EPDE as shipped (percentage discrepancy, instability as the second
# Pareto axis, variance-weighted sparsity) with the finite differences of the
# shared protocol.

default: {}

# Old EPDE: L2 discrepancy, LASSO sparsity, complexity as the second axis
# (the earlier pipeline of the group's former benchmark).
legacy:
  search:
    objectives:
      discrepancy_metric: l2
      sparsity_cls: lasso
      sparsity_kwargs: {initial_sparsity_interval: [1.0e-12, 1.0e-4]}
      second_objective: complexity

# Derivatives from local polynomial fits instead of finite differences.
poly:
  search:
    preprocessing:
      default_preprocessor_type: poly

# Support chosen by the knee of the residual-vs-size curve.
knee:
  search:
    objectives:
      sparsity_cls: knee

# Instability measured by cross-validation over windows.
instab_cv:
  search:
    objectives:
      instability_metric: cv

# The trigonometric family exactly as the group's original scripts declare it:
# the library's family on a narrow interval around 2. Measures how numerically
# equal tokens of nearby frequencies affect the search.
trig_native:
  search:
    search_space:
      tokens:
        - {family: grid, labels: [x], max_power: 2}
        - {family: trigonometric, freq: [1.99999999, 2.00000001]}

# Baseline outside EPDE: sparse regression (PySINDy's STLSQ) on a fixed
# library built from the same building blocks as the EPDE pool.
pysindy:
  method: pysindy
  pysindy:
    differentiation: epde                # same native preprocessing as EPDE; alternatives are explicit
    threshold: auto                      # chosen on a held-out tail of the record
    max_terms_product: 2

# PySINDy as the PDEComp benchmark runs it (its own code at a pinned commit),
# only on the records whose arrays are PDEComp's data sets. "fixed": shared
# NumPy derivatives and candidate library with a tuned optimizer per data set;
# "native": PySINDy's own differentiation and libraries. The search section is
# not used by these runs; it only describes how the result is checked on the data.
pysindy_pdecomp_fixed:
  method: pdecomp
  pdecomp: {protocol: fixed}

pysindy_pdecomp_native:
  method: pdecomp
  pdecomp: {protocol: native}

deepmod_pdecomp_native:
  method: deepmod
  deepmod: {protocol: native}

deepmod_pdecomp_fixed:
  method: deepmod
  deepmod: {protocol: fixed}

discover_pdecomp_native:
  method: discover
  discover: {protocol: native}

discover_pdecomp_fixed:
  method: discover
  discover: {protocol: fixed}
