# Navier-Stokes cylinder wake on gate.py's subset (loader default).
# First derivative in t, second in space; boundary as in gate.py, where the
# x-width keeps the scored region away from the open inflow.
search:
  domain: {boundary_width: [2, 2, 7]}
  preprocessing: {max_deriv_order: [1, 2, 2]}
  evolution: {population_size: 48}
