name: Complete CatBoost advisor and public gallery
on:
  push:
    branches: [feat/catboost-advisor-public-results]
    paths: [.github/workflows/advisor-complete.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:projects/pic:projects/pic/app
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      EPDE_TEST_NATIVE_METHODS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13247565424'
          run-id: 41667264588
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tested
      - name: Restore exact tested science and add collection-lifetime regression
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,tarfile,subprocess
          archive=next(pathlib.Path(os.environ['RUNNER_TEMP'],'tested').rglob('advisor-publish-source.tar.gz'))
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='ad8adc0939f7680671812e0be5a86dc2638caa928ce1c0cea1b660758f51e8d6'
          with tarfile.open(archive) as tar:
              members=[m for m in tar.getmembers() if m.isfile() and '__pycache__' not in m.name and not m.name.endswith('.pyc')]
              for m in members:
                  name=pathlib.PurePosixPath(m.name)
                  assert not name.is_absolute() and '..' not in name.parts and '.git' not in name.parts
              tar.extractall('.',members=members,filter='data')
          p=pathlib.Path('projects/pic/browser_demo/smoke_public_results.mjs');s=p.read_text()
          for label in ['Compare this example','Try this dataset in Lab','Delete this result']:
              old="name:'"+label+"',exact:true"
              assert old in s
              s=s.replace(old,'name:/'+label+'$/')
          s=s.replace("}finally{await browser.close();}","}catch(error){await page.screenshot({path:out+'/failure.png',fullPage:true}).catch(()=>{}); console.error('PUBLIC_EXAMPLE_ACTIONS',await app.getByRole('button').allTextContents().catch(()=>[])); throw error;}finally{await browser.close();}")
          p.write_text(s)
          files=subprocess.check_output(['git','ls-files','.github/advisor-*.b64','.github/workflows/advisor-*.yml'],text=True).splitlines()
          files=[p for p in files if p!='.github/workflows/advisor-campaign.yml']
          if files:subprocess.run(['git','rm','-f','--',*files],check=True)
          PY
          cat > projects/pic/tests/test_collection_persistence.py <<'PY'
          """Collection preference outlives Streamlit's page-scoped widgets."""
          from pathlib import Path
          from unittest.mock import patch
          from streamlit.testing.v1 import AppTest
          from support.discovery_lab import job_queue as queue
          APP=Path(__file__).resolve().parents[1]/'app'
          SOURCE='''
          import streamlit as st
          from support.discovery_lab.public_results_ui import choose_collection
          if st.session_state.get('show_collection',True):
              choose_collection(False)
          else:
              st.write('Another page without the collection widget')
          '''
          def collection(app):
              return next(g for g in app.get('button_group') if g.label=='Result collection')
          def test_collection_preference_survives_widget_cleanup():
              app=AppTest.from_string(SOURCE).run()
              assert collection(app).value=='Public results'
              collection(app).set_value('My results').run()
              app.session_state['show_collection']=False
              app.run()
              app.session_state['show_collection']=True
              app.run()
              assert not app.exception
              assert collection(app).value=='My results'
          def test_private_collection_survives_results_compare_navigation(tmp_path):
              with patch.object(queue,'ROOT',tmp_path):
                  app=AppTest.from_file(str(APP/'Home.py'),default_timeout=60).run()
                  app.switch_page('views/12_Discovery_compare.py').run()
                  collection(app).set_value('My results').run()
                  app.switch_page('views/11_Discovery_results.py').run()
                  assert not app.exception
                  assert collection(app).value=='My results'
                  assert any('No experiments yet' in x.value for x in app.info)
                  collection(app).set_value('Public results').run()
                  app.switch_page('views/12_Discovery_compare.py').run()
                  assert not app.exception
                  assert collection(app).value=='Public results'
          def test_new_search_can_explicitly_open_private_results():
              app=AppTest.from_string(SOURCE).run()
              app.session_state['discovery_result_collection']='My results'
              app.run()
              assert not app.exception
              assert collection(app).value=='My results'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install exact CPU environment
        run: |
          uv sync --project projects/pic --extra cpu --extra app --locked
          uv pip install --python projects/pic/.venv/bin/python catboost==1.2.8 pytest
      - name: Reproduce preference loss before the fix
        run: |
          set +e
          projects/pic/.venv/bin/python -m pytest -q projects/pic/tests/test_collection_persistence.py::test_collection_preference_survives_widget_cleanup > "$RUNNER_TEMP/advisor-complete-red.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/advisor-complete-red.log"
          test "$status" -eq 1
      - name: Separate permanent preference from page-scoped widget identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/pic/app/support/discovery_lab/public_results_ui.py')
          s=p.read_text();start=s.index('def choose_collection(');end=s.index('def public_groups(')
          replacement='''_COLLECTION_KEY = "discovery_result_collection"
          _WIDGET_KEY = "_discovery_result_collection_widget"
          _COLLECTIONS = ["My results", "Public results"]


          def _remember_collection():
              selected = st.session_state.get(_WIDGET_KEY)
              if selected in _COLLECTIONS:
                  st.session_state[_COLLECTION_KEY] = selected


          def choose_collection(has_private):
              # Streamlit removes widgets when changing pages. Keep user intent in
              # a non-widget key, and rehydrate the page-local control on every render.
              preferred = st.session_state.get(_COLLECTION_KEY)
              if preferred not in _COLLECTIONS:
                  preferred = "My results" if has_private else "Public results"
              st.session_state[_WIDGET_KEY] = preferred
              chosen = st.segmented_control(
                  "Result collection", _COLLECTIONS, key=_WIDGET_KEY,
                  selection_mode="single", on_change=_remember_collection,
              )
              st.session_state[_COLLECTION_KEY] = chosen if chosen in _COLLECTIONS else preferred
              return st.session_state[_COLLECTION_KEY] == "Public results"


          '''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/superpowers projects/pic/README.md projects/pic/app projects/pic/scripts projects/pic/tests projects/pic/browser_demo projects/pic/experiments/advisor_v1 projects/pic/public_results .github/workflows
          git diff --cached --check
          git commit -m 'feat(explorer): trained CatBoost recommendations and persistent public/private result galleries'
      - name: Scientific and application regressions after fix
        run: |
          set -o pipefail
          projects/pic/.venv/bin/python -m pytest -q projects/pic/tests 2>&1 | tee "$RUNNER_TEMP/advisor-complete-tests.log"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and check scripts
        working-directory: projects/pic/browser_demo
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node --check smoke_public_results.mjs
          node test_starting_provenance.mjs
      - name: Start actual application
        run: |
          projects/pic/.venv/bin/python -m streamlit run projects/pic/app/Home.py --server.headless=true --browser.gatherUsageStats=false > "$RUNNER_TEMP/advisor-complete-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/advisor-complete.pid"
          for n in $(seq 1 45); do
            curl --fail --silent http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/advisor-complete-server.log"; exit 1
      - name: Public results, four-method Compare, mobile and isolated private results
        working-directory: projects/pic/browser_demo
        run: |
          set -o pipefail
          node smoke_public_results.mjs 2>&1 | tee "$RUNNER_TEMP/advisor-complete-browser.log"
      - name: Publish verified feature branch
        run: git push origin HEAD:refs/heads/feat/catboost-advisor-public-results
      - name: Stop server and retain exact tested source
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/advisor-complete.pid" ]]; then kill "$(cat "$RUNNER_TEMP/advisor-complete.pid")" 2>/dev/null || true; fi
          git rev-parse HEAD > "$RUNNER_TEMP/advisor-complete-revision.txt"
          git archive HEAD --format=tar.gz --output="$RUNNER_TEMP/advisor-complete-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisor-complete-verification
          path: |
            ${{ runner.temp }}/advisor-complete-*.log
            ${{ runner.temp }}/advisor-complete-revision.txt
            ${{ runner.temp }}/advisor-complete-source.tar.gz
            projects/pic/browser_demo/.cache/public-results/
          include-hidden-files: true
          retention-days: 30
