name: Mirror repo to GitLab

# Research-fork safety: this inherited production mirroring job must NEVER
# copy the unreviewed `nir1` branch into the ITMO GitLab mirror. The protected
# upstream workflow remains unchanged; this scope exists only on our fork.
on:
  push:
    branches: [master]

jobs:
  call-nss-ops-mirror-workflow:
    uses: ITMO-NSS-team/NSS-Ops/.github/workflows/mirror-repo.yml@master
    with:
      GITLAB_URL: 'https://gitlab.actcognitive.org/itmo-nss-team/EPDE.git'
    secrets:
      GITLAB_USER: ${{ secrets.GITLAB_USER }}
      GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
