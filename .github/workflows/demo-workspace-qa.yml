name: Demo workspace smoke tests
on:
  push:
    branches:
      - demo/streamlit-community-cloud
    paths:
      - 'projects/pic/app/Home.py'
      - 'projects/pic/app/views/10_Discovery_lab.py'
      - 'projects/pic/app/views/13_Browser_sindy.py'
      - 'projects/pic/app/views/11_Discovery_results.py'
      - 'projects/pic/app/views/12_Discovery_compare.py'
      - 'projects/pic/app/views/9_How_EPDE_works.py'
      - 'projects/pic/app/support/sindy_guide.py'
      - 'projects/pic/app/static/likec4-views.js'
      - 'projects/pic/app/support/discovery_lab/**'
      - 'projects/pic/tests/test_demo_workspace_navigation.py'
      - 'projects/pic/tests/test_demo_lab_settings.py'
      - 'projects/pic/tests/test_demo_local_cpu.py'
      - 'projects/pic/tests/test_demo_execution_routing.py'
      - 'projects/pic/app/local_worker_service.py'
      - '.github/workflows/demo-workspace-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all public demo page syntax
        run: |
          python -m compileall -q projects/pic/app/Home.py projects/pic/app/views/13_Browser_sindy.py projects/pic/app/views/10_Discovery_lab.py projects/pic/app/views/11_Discovery_results.py projects/pic/app/views/12_Discovery_compare.py projects/pic/app/support/discovery_lab projects/pic/app/views/9_How_EPDE_works.py projects/pic/app/support/sindy_guide.py
      - name: Verify minimal sidebar navigation and shared owner
        run: |
          python -m unittest discover -s projects/pic/tests -p 'test_demo_workspace_navigation.py' -v
  scientific-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: .:projects/pic:projects/pic/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked CPU app dependencies
        run: uv sync --project projects/pic --extra cpu --extra app --locked
      - name: Validate original record profiles and public search controls
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_demo_lab_settings.py' -v
      - name: End-to-end real EPDE on free-hosting-sized dataset
        run: |
          projects/pic/.venv/bin/python - <<'PY'
          from support.discovery_lab.worker import _run_record
          request={"method":"epde","source":"record","dataset":"ode","variant":"default",
                   "noise":0.0,"seed":0,"effort":"custom",
                   "overrides":{"search":{"evolution":{
                       "population_size":4,"training_epochs":1}}}}
          record=_run_record(request,hosted=True)
          assert record["status"]=="ok", record.get("error")
          assert record["method"]=="epde" and record["front"]
          request["dataset"]="ns"
          try:
              _run_record(request,hosted=True)
              raise AssertionError("Heavy Navier-Stokes was not blocked")
          except ValueError as exc:
              assert "Hosted EPDE refused" in str(exc)
          print("HOSTED_EPDE_PASS; HEAVY_PDE_DENIED")
          PY
      - name: Test loopback authentication and browser bridge schema
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_demo_local_cpu.py' -v
      - name: Verify EPDE free-server admission and visitor-browser routing
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_demo_execution_routing.py' -v
      - name: Extended scientific contracts — real ODE, fourth-order PDE, generated upload and queue isolation
        timeout-minutes: 12
        run: |
          projects/pic/.venv/bin/python -m unittest -v \
            test_discovery_lab.ContractTests \
            test_discovery_lab.EquationGeneratorTests \
            test_discovery_lab.QueueTests \
            test_discovery_lab.ReferenceLawTests \
            test_discovery_lab.WorkerAndPage.test_ode_record_is_found_and_solved \
            test_discovery_lab.WorkerAndPage.test_fourth_order_pde_is_solved \
            test_discovery_lab.WorkerAndPage.test_generated_ode_is_scored_against_its_law
        working-directory: projects/pic/tests
      - name: Smoke-test PySINDy native local scientific adapter
        run: |
          projects/pic/.venv/bin/python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "projects/pic/app")
          from local_worker_service import _execute
          req = {"method": "pysindy", "source": "record", "dataset": "ode",
                 "variant": "pysindy", "overrides": {}, "noise": 0.0,
                 "seed": 0, "effort": "standard"}
          with tempfile.TemporaryDirectory() as temp:
              record = _execute(req, Path(temp))
          assert record["method"] == "pysindy", record
          assert record["status"] in ("ok", "unsupported"), record
          assert record["execution_location"] == "user_computer"
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local browser bridge ES module syntax
        run: node --input-type=module --check < projects/pic/app/support/discovery_lab/local_browser_assets/local_bridge.js
  report:
    name: Record Streamlit navigation and science configuration QA
    needs: [navigation, scientific-config]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve test outcomes
        env:
          NAV: ${{ needs.navigation.result }}
          SCI: ${{ needs.scientific-config.result }}
        run: |
          python - <<'PY'
          import json,os,datetime,pathlib
          data={
            "revision":os.environ["GITHUB_SHA"],
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "navigation":os.environ["NAV"],
            "scientific_settings":os.environ["SCI"],
            "verified":os.environ["NAV"]=="success" and os.environ["SCI"]=="success",
          }
          pathlib.Path("/tmp/epde-demo-routing.json").write_text(json.dumps(data,indent=2))
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          blob=$(git hash-object -w /tmp/epde-demo-routing.json)
          tree=$(printf '100644 blob %s\tresult.json\n' "$blob" | git mktree)
          commit=$(printf 'Streamlit demo QA report\n' | git commit-tree "$tree")
          git push --force origin "$commit:refs/heads/ci/demo-routing-qa"
