name: Demo workspace smoke tests
on:
  push:
    branches:
      - demo/streamlit-community-cloud
    paths:
      - 'projects/pic/app/Home.py'
      - 'projects/pic/app/views/10_Discovery_lab.py'
      - 'projects/pic/app/views/11_Discovery_results.py'
      - 'projects/pic/app/views/12_Discovery_compare.py'
      - 'projects/pic/app/views/9_How_EPDE_works.py'
      - 'projects/pic/app/support/sindy_guide.py'
      - 'projects/pic/app/static/likec4-views.js'
      - 'projects/pic/app/support/discovery_lab/**'
      - 'projects/pic/tests/test_demo_workspace_navigation.py'
      - 'projects/pic/tests/test_demo_lab_settings.py'
      - '.github/workflows/demo-workspace-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all public demo page syntax
        run: |
          python -m compileall -q projects/pic/app/Home.py projects/pic/app/views/10_Discovery_lab.py projects/pic/app/views/11_Discovery_results.py projects/pic/app/views/12_Discovery_compare.py projects/pic/app/support/discovery_lab projects/pic/app/views/9_How_EPDE_works.py projects/pic/app/support/sindy_guide.py
      - name: Verify minimal sidebar navigation and shared owner
        run: |
          python -m unittest discover -s projects/pic/tests -p 'test_demo_workspace_navigation.py' -v
  scientific-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: .:projects/pic:projects/pic/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked CPU app dependencies
        run: uv sync --project projects/pic --extra cpu --extra app --locked
      - name: Validate original record profiles and public search controls
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_demo_lab_settings.py' -v

