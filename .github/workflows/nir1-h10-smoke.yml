name: NIR1 | H10 causal-MDL smoke
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-h10-smoke.yml'
permissions:
  contents: read
jobs:
  full-operator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dataset: [nir1_heat, nir1_advdiff, nir1_wave]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-h10-uv
      NIR1_DISABLE_GRAM_CACHE: '1'
      NIR1_CHI2_PREFIX_CACHE: '0'
    steps:
      - name: Checkout exact test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Lock PIC environment
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Test one EPDE generation with H10
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.cli epde --dataset '${{ matrix.dataset }}' --variant nir1_dynamic_mdl --seed 0 --data-seed 0 --smoke --output output/smoke.json
          git rev-parse HEAD > output/revision.txt
      - name: Preserve all feedback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-h10-${{ matrix.dataset }}-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
