name: Optional one-click EPDE Windows launcher
on:
  push:
    branches: [demo/streamlit-community-cloud]
    paths:
      - 'projects/pic/native_launcher/**'
      - '.github/workflows/native-one-click-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: native
        name: Bootstrap from cmd with no preinstalled Git, Python or uv prerequisite
        shell: pwsh
        env:
          EPDE_SETUP_ONLY: '1'
          EPDE_SOURCE_OVERRIDE: ${{ github.workspace }}
        run: |
          $launcher = Join-Path (Join-Path (Join-Path "projects" "pic") "native_launcher") "EPDE-Start.cmd"
          & cmd.exe /c $launcher *> native-log.txt
          $log = Get-Content native-log.txt -Raw
          $log | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) { throw "Native launcher failed with code $LASTEXITCODE" }
          if ($log -notmatch "EPDE,") {
            if ($log -notmatch "PINNED" -and $log -notmatch "1") { throw "Native import smoke result missing" }
          }
      - name: Store one-click Windows launcher as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EPDE-Windows-OneClick-Launcher
          path: projects/pic/native_launcher/EPDE-Start.cmd
          retention-days: 30
      - name: Publish tested script as public release asset
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "epde-native-launcher-v1"
          $file = "projects/pic/native_launcher/EPDE-Start.cmd"
          gh release view $tag 2>$null
          if($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --target demo/streamlit-community-cloud --title "Native EPDE Windows one-click launcher" --notes "Optional native EPDE (original EpdeSearch) and PySINDy scientific bootstrap. Users explicitly download and open the CMD file. The first run downloads pinned source and packages. Windows x64 CPU only; no browser can execute this file without consent." --latest=false
          }
          if($LASTEXITCODE -ne 0) { throw "Could not publish the tested script" }
      - name: Publish Windows launcher verification
        if: always()
        shell: pwsh
        env:
          RESULT: ${{ steps.native.outcome }}
        run: |
          $data = @{
            revision = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            windows_native = $env:RESULT
            verified = ($env:RESULT -eq "success")
            log = if(Test-Path native-log.txt) { (Get-Content native-log.txt -Raw | Select-Object -Last 1) } else { "" }
          }
          $data | ConvertTo-Json -Depth 4 | Out-File -Encoding UTF8 native-result.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          $blob = git hash-object -w native-result.json
          $treeInput = "100644 blob $blob" + [char]9 + "result.json" + [char]10
          $tree = $treeInput | git mktree
          $commit = "Native launcher verification" | git commit-tree $tree
          git push --force origin "$($commit):refs/heads/ci/windows-native-launcher"
