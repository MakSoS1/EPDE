name: NIR1 | original S1 all-front replay (no evolution)
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-s1-front-replay.yml'
permissions:
  contents: read
  actions: read
jobs:
  replay-original-s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-s1-replay-cache
    steps:
      - name: Checkout current immutable analysis code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install locked CPU dependencies
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Retrieve immutable S1 ledger
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38076377893
          name: nir1-ledger-38076377893-attempt-1
          path: prepared/
      - name: Retrieve four S1 raw data shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38076377893
          pattern: nir1-results-38076377893-attempt-1-shard-*
          path: original/
      - name: Reconcile ALL original 120 planned searches
        run: |
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.cli summarize --manifest prepared/planned.json --records original/ --output output/validated-ledger.json
      - name: Compare native single, selected-consensus and all-front consensus
        run: |
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.front_consensus_dev --manifest prepared/planned.json --records original/ --output output/S1_FRONT_REPLAY.json
          git rev-parse HEAD > output/analyzer-code-sha.txt
          printf '%s\n' 'DEVELOPMENT ONLY: Original S1 data was previously observed; this is NOT S2 confirmation' > output/NO_CONFIRMATION.txt
      - name: Preserve records of both positive and negative development outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-s1-allfront-development-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

# 2026-10-11: rerun complete development replay with equal-budget native min-loss control.
