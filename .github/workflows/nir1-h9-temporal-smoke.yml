name: NIR1 | H9 dynamic-target smoke
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-h9-temporal-smoke.yml'
permissions:
  contents: read
jobs:
  same-budget-epde-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset: [nir1_heat, nir1_advdiff, ode]
        arm: [default, nir1_dynamic_anchor]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-h9-uv
      NIR1_DISABLE_GRAM_CACHE: '1'
      NIR1_CHI2_PREFIX_CACHE: '0'
    steps:
      - name: Checkout identical source for both arms
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install PIC CPU dependencies
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Run true EPDE target-selection smoke (4 individuals x 1 generation)
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.cli epde --dataset '${{ matrix.dataset }}' --variant '${{ matrix.arm }}' --seed 0 --data-seed 0 --smoke --output output/native.json
          git rev-parse HEAD > output/source-sha.txt
      - name: Preserve native full front and all errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-h9-smoke-${{ matrix.dataset }}-${{ matrix.arm }}-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
