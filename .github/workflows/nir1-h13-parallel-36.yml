name: NIR1 | H13 rank diagnostic parallel 36 systems
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-h13-parallel-36.yml'
permissions:
  contents: read
jobs:
  same-observation-diagnostic-no-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-h13-same-observations
    steps:
      - name: Checkout analytical data and frozen H13 procedure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Locked PIC data loader dependencies
        run: uv sync --project projects/pic --extra cpu --locked
      - name: No oracle, no extra EPDE search, rank spectra on all original physical observations
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.h13_full_benchmark --output output/H13_36_SPECTRA.json
          git rev-parse HEAD > output/source-sha.txt
          printf '%s\n' 'H13 is a RANK DIAGNOSTIC, NOT an independent equation discovery algorithm or a competitor on exact match. 36 benchmark datasets, zero extra samples, zero evolution, uncalibrated continuous sigma_min/sigma_max, original variables only, no truth. Do not equate diagnostic success with discovery success.' > output/SCIENTIFIC_SCOPE.txt
      - name: Preserve complete diagnostic report even with errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-h13-rank-36-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
