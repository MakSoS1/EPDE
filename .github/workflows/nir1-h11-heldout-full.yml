name: NIR1 | H11 prospective different-physics quality
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-h11-heldout-full.yml'
permissions:
  contents: read
jobs:
  full-search-equal-data-and-compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [nir1_h11_gaussian_heat, nir1_h11_advection_decay, nir1_h11_viscous_burgers, nir1_h11_klein_gordon, nir1_h11_biharmonic, nir1_h11_airy, nir1_h11_shear, nir1_h11_logistic_field, nir1_h11_gauss_reactdiff]
        variant: [default, nir1_dynamic_mdl_select]
        seed: [0, 1]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-h11-prospective
      NIR1_DISABLE_GRAM_CACHE: '1'
      NIR1_CHI2_PREFIX_CACHE: '0'
    steps:
      - name: Checkout one immutable research SHA (both arms)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Frozen PIC dependencies
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Full EPDE 16 individuals, five epochs, one identical dataset
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.cli epde --dataset '${{ matrix.dataset }}' --variant '${{ matrix.variant }}' --seed '${{ matrix.seed }}' --data-seed 0 --output output/native-full.json
          git rev-parse HEAD > output/source-sha.txt
          printf '%s\n' 'H11 prospective physical-law test. Frozen method: temporal dynamic MDL evolved fitness + argmin first objective as postselection. Native default identical data/seed and search budget. The physical x0=time prior is supplied to H11; compare also equal-prior baseline postfilter without extra evolution. No E1, no additional data, no extra restarts. All statuses and timeouts count.' > output/SCIENTIFIC_SCOPE.txt
      - name: Preserve complete native Pareto fronts and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-h11-${{ matrix.dataset }}-${{ matrix.variant }}-seed${{ matrix.seed }}-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
