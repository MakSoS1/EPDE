name: NIR1 | chi2 prefix E1 microbenchmark
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-chi2-perf.yml'
permissions:
  contents: read
jobs:
  benchmark-axis-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-chi2-perf-uv
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install locked CPU environment
        run: |
          uv sync --project projects/pic --extra cpu --locked
      - name: Run matched masks and same-data microbenchmark
        run: |
          mkdir -p artifacts
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.benchmark_chi2_prefix --time-levels 80 --space-levels 160 --output artifacts/prefix-12800.json
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.benchmark_chi2_prefix --time-levels 160 --space-levels 160 --output artifacts/prefix-25600.json
          git rev-parse HEAD > artifacts/source-sha.txt
      - name: Preserve all measured timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-chi2-prefix-timings-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
