name: NIR1 | balanced cached chi2 full EPDE parity
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-full-chi2-balanced.yml'
permissions:
  contents: read
concurrency:
  group: nir1-chi2-balanced-${{ github.sha }}
  cancel-in-progress: false
jobs:
  matched-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [burgers, kdv, wave]
        seed: [0, 1, 2, 3, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-chi2-balanced-uv
    steps:
      - name: Checkout identical NIR1 revision for both A/B paths
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install immutable locked CPU environment
        run: |
          uv sync --project projects/pic --extra cpu --locked
          mkdir -p artifacts
      - name: Two full-budget PIC searches; reverse first/second execution order on odd seeds
        env:
          NIR1_SEED: ${{ matrix.seed }}
          NIR1_DATASET: ${{ matrix.dataset }}
        run: |
          set -euo pipefail
          run_search() {
            local cached="$1" file="$2"
            NIR1_CHI2_PREFIX_CACHE="$cached" projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.cli epde \
              --dataset "$NIR1_DATASET" --variant default \
              --seed "$NIR1_SEED" --data-seed 0 --output "artifacts/$file"
          }
          if (( NIR1_SEED % 2 == 0 )); then
            printf 'reference_first\n' > artifacts/order.txt
            run_search 0 reference.json
            run_search 1 cached.json
          else
            printf 'cached_first\n' > artifacts/order.txt
            run_search 1 cached.json
            run_search 0 reference.json
          fi
      - name: Fail if exact full-search candidate/selected structure changes
        run: |
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.compare_full_e1 \
            --reference artifacts/reference.json --cached artifacts/cached.json \
            --output artifacts/paired-parity.json
          git rev-parse HEAD > artifacts/source-sha.txt
      - name: Preserve every completed raw attempt whether parity passed or failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-chi2-balanced-${{ matrix.dataset }}-seed-${{ matrix.seed }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
