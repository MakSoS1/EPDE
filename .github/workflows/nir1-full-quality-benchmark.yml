name: NIR1 | Full quality benchmark EPDE vs H12 H14
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-full-quality-benchmark.yml'
permissions:
  contents: read
jobs:
  matched-full-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset:
          # S1 canonical benchmark, previously observed (development only)
          - ac
          - burgers
          - duffing
          - lv
          - ode
          - vdp
          # S2e analytical diagnostic systems, previously observed
          - nir1_decay
          - nir1_harmonic
          - nir1_logistic
          - nir1_quadratic
          - nir1_cubic
          - nir1_advection
          - nir1_heat
          - nir1_reactiondiff
          - nir1_wave
          - nir1_advdiff
          # Previously observed H11 physical-system suite
          - nir1_h11_gaussian_heat
          - nir1_h11_advection_decay
          - nir1_h11_viscous_burgers
          - nir1_h11_klein_gordon
          - nir1_h11_biharmonic
          - nir1_h11_airy
          - nir1_h11_shear
          - nir1_h11_logistic_field
          - nir1_h11_gauss_reactdiff
        variant: [default, nir1_dynamic_mdl_repair]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-full-accuracy
      NIR1_DISABLE_GRAM_CACHE: '1'
      NIR1_CHI2_PREFIX_CACHE: '0'
    steps:
      - name: Checkout same frozen source for both evolution arms
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Locked CPU EPDE environment
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Exactly ONE full EPDE evolution for each (dataset, arm) 16x5
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.cli epde --dataset '${{ matrix.dataset }}' --variant '${{ matrix.variant }}' --seed 0 --data-seed 0 --output output/native-full.json
          git rev-parse HEAD > output/source-sha.txt
          printf '%s\n' 'FULL 25-SYSTEM RETROSPECTIVE SUITE. Same data/seed and exact 16x5 population/epochs. 25 systems x2 methods. EPDE default vs H12 temporal target + evolved MDL + argmin. H14 causal closure is evaluated OFFLINE from the H12 front, no third evolution. 11 distinct prospective physical H14 systems are a separate immutable run 38137822492; NEVER pool as independent confirmation or hide errors/timeouts. No E1 acceleration.' > output/SCIENTIFIC_SCOPE.txt
      - name: Preserve failures, original entire Pareto fronts, objectives, timing and source SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-full-quality-${{ matrix.dataset }}-${{ matrix.variant }}-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
