name: Streamlit EPDE Explorer | Cloud requirements smoke
on:
  push:
    branches: [research/nir1-mdl-factorial-2026-10-14]
    paths:
      - '.github/workflows/nir1-streamlit-cloud-requirements.yml'
permissions:
  contents: read
jobs:
  published-requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      PYTHONPATH: .:projects/pic:projects/pic/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install exact Community Cloud application requirements
        run: python -m pip install -r projects/pic/app/requirements.txt
      - name: Smoke test all pages on Cloud dependency versions
        run: python -m unittest discover -s projects/pic/tests -p 'test_app.py' -v
      - name: Check post-call input, settings and scientific diagnostics
        run: python -m unittest discover -s projects/pic/tests -p 'test_streamlit_supervisor_20261012.py' -v
      - name: PySINDy baseline and 1/x token scientific unit tests
        run: python -m unittest discover -s projects/pic/tests -p 'test_streamlit_reciprocal_token.py' -v
