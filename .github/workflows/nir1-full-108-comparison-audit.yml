name: NIR1 | All H11 H12 H13 H14 full comparative audit
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-full-108-comparison-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-108-search-reconciliation-and-H13:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-108-audit
    steps:
      - name: Checkout independently auditable report code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Locked PIC scoring packages
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Wait for all original unchanged 108 searches and rank diagnostic
        shell: bash
        run: |
          set -euo pipefail
          # Wait on the first and ONLY complete EPDE runs. Never retry any
          # failed search or discard a bad equation to boost quality.
          for attempt in $(seq 1 315); do
            ready=1
            for row in "38137822492:22" "38139042448:50" "38139430976:36" "38139541832:1"; do
              run="${row%%:*}"
              expect="${row##*:}"
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100")
              archive=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
              count=$(jq -r '.total_count' <<< "$jobs")
              done_count=$(jq '[.jobs[]|select(.status=="completed")]|length' <<< "$jobs")
              archive_count=$(jq -r '.total_count' <<< "$archive")
              echo "$run complete=$done_count/$count archives=$archive_count/$expect"
              if [ "$count" -ne "$expect" ] || [ "$done_count" -ne "$expect" ] || [ "$archive_count" -ne "$expect" ]; then
                ready=0
              fi
            done
            if [ "$ready" -eq 1 ]; then
              echo 'Original 108 searches and H13 original diagnosis all preserved.'
              exit 0
            fi
            sleep 60
          done
          echo "Full original evidence not ready after audit wait window" >&2
          exit 2
      - name: Fetch all 22 prospective physical H14 original searches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38137822492
          pattern: nir1-h14-physical-*
          path: original-prospective/
      - name: Fetch all 50 retrospective default and H12 original searches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38139042448
          pattern: nir1-full-quality-*
          path: original-retrospective/
      - name: Fetch all 36 H11 full EPDE original searches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38139430976
          pattern: nir1-h11-parallel-*
          path: original-h11/
      - name: Fetch original 36-system H13 truth-blind certificate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38139541832
          pattern: nir1-h13-rank-36-*
          path: original-h13/
      - name: Compute reproducible paired accuracies and statistics, no new EPDE search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.analyze_full_quality_108 \
            --prospective original-prospective/ \
            --retrospective original-retrospective/ \
            --h11 original-h11/ \
            --h13 "$(find original-h13 -name 'H13_36_SPECTRA.json' | head -1)" \
            --output verified/NIR1_FULL_108_VERIFIED.json
          git rev-parse HEAD > verified/auditor-code-sha.txt
          printf '%s\n' 'H11 full 36, H12 + baseline full 72 =108 identical-budget EPDE 16x5 searches. H13 is 36 no-oracle matrix-spectrum DIAGNOSTICS, NOT a discovery model or an extra evolution. H14 is an offline Pareto selector. 11 H14 physical systems comprise prior-registered H14 cohort, 25 earlier viewed systems are exploratory. Third-arm H11 was added AFTER H14 original runs finished; no independent third-arm preregistration. Failed search counts as incorrect; same-prior baseline controls and paired signflip by physical-system cohort.' > verified/SCIENTIFIC_SCOPE.txt
      - name: Preserve complete auditable results even if a runner task fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NIR1-FULL-108-H11-H12-H13-H14-AUDIT-${{ github.sha }}
          path: verified/
          if-no-files-found: warn
          retention-days: 30
