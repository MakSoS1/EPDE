name: Browser-only Equation Lab — verify and publish
on:
  push:
    branches: [demo/streamlit-community-cloud]
    paths:
      - 'projects/pic/browser_demo/**'
      - 'projects/pic/app/static/likec4-views.js'
      - '.github/workflows/browser-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equation-browser-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Genuine PySINDy and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write  # write a tiny public verification result to a dedicated CI branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific test dependencies without EPDE/Torch
        run: python -m pip install numpy scipy scikit-learn pysindy==2.1.0
      - id: numerical
        name: Compile and numerically test the browser scientific engine
        run: |
          set -o pipefail
          python -m py_compile projects/pic/browser_demo/science.py projects/pic/browser_demo/test_science.py 2>&1 | tee /tmp/epde-numerical.log
          python -m unittest discover -s projects/pic/browser_demo -p 'test_science.py' -v 2>&1 | tee -a /tmp/epde-numerical.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: syntax
        name: Validate JavaScript syntax
        run: |
          node --check projects/pic/browser_demo/app.js
          node --check projects/pic/browser_demo/science_worker.js
          node --check projects/pic/browser_demo/smoke.mjs
      - id: browser_setup
        name: Install Chromium test runner
        working-directory: projects/pic/browser_demo
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/epde-browser-setup.log
          npx playwright install --with-deps chromium 2>&1 | tee -a /tmp/epde-browser-setup.log
      - id: serve
        name: Run browser site with bundled original LikeC4 model
        run: |
          cp projects/pic/app/static/likec4-views.js projects/pic/browser_demo/likec4-views.js
          python -m http.server 8766 --directory projects/pic/browser_demo > /tmp/browser-demo-http.log 2>&1 &
          echo $! > /tmp/browser-demo-server.pid
          sleep 2
          curl --fail http://127.0.0.1:8766/ > /dev/null
      - id: browser
        name: REAL WebAssembly PySINDy in Chromium, storage and Compare
        timeout-minutes: 12
        working-directory: projects/pic/browser_demo
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee /tmp/epde-browser.log
      - name: Publish verification outcomes for inspection
        if: always()
        env:
          NUMERICAL: ${{ steps.numerical.outcome }}
          JS_SYNTAX: ${{ steps.syntax.outcome }}
          SETUP: ${{ steps.browser_setup.outcome }}
          SERVER: ${{ steps.serve.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          python - <<'PY'
          import json,os,datetime
          values = {
              "revision":os.environ["GITHUB_SHA"],
              "timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "numerical":os.environ.get("NUMERICAL"),
              "javascript":os.environ.get("JS_SYNTAX"),
              "browser_setup":os.environ.get("SETUP"),
              "server":os.environ.get("SERVER"),
              "chromium_wasm":os.environ.get("BROWSER"),
          }
          values["verified"] = all(values[k]=="success" for k in
                                   ("numerical","javascript","chromium_wasm"))
          from pathlib import Path
          numeric_log = Path("/tmp/epde-numerical.log")
          values["numerical_log_tail"] = numeric_log.read_text(errors="replace")[-12000:] if numeric_log.exists() else ""
          browser_log = Path("/tmp/epde-browser.log")
          values["browser_log_tail"] = browser_log.read_text(errors="replace")[-12000:] if browser_log.exists() else ""
          setup_log = Path("/tmp/epde-browser-setup.log")
          values["setup_log_tail"] = setup_log.read_text(errors="replace")[-10000:] if setup_log.exists() else ""
          server_log = Path("/tmp/browser-demo-http.log")
          values["server_log_tail"] = server_log.read_text(errors="replace")[-2000:] if server_log.exists() else ""
          with open("/tmp/epde-browser-verification.json","w") as f:
              json.dump(values,f,indent=2)
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          blob=$(git hash-object -w /tmp/epde-browser-verification.json)
          tree=$(printf '100644 blob %s\tresult.json\n' "$blob" | git mktree)
          commit=$(printf 'Browser smoke report for %s\n' "$GITHUB_SHA" | git commit-tree "$tree")
          git push --force origin "$commit:refs/heads/ci/browser-demo-verification"
      - name: Preserve failed browser screenshot and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-lab-smoke-debug
          path: |
            projects/pic/browser_demo/browser-smoke-last.png
            /tmp/browser-demo-http.log
          if-no-files-found: ignore

  publish:
    name: GitHub Pages — static only, no compute server
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website (no Python/Node runtime on host)
        run: |
          mkdir -p /tmp/equation-browser-site
          cp projects/pic/browser_demo/index.html /tmp/equation-browser-site/
          cp projects/pic/browser_demo/app.js /tmp/equation-browser-site/
          cp projects/pic/browser_demo/style.css /tmp/equation-browser-site/
          cp projects/pic/browser_demo/science.py /tmp/equation-browser-site/
          cp projects/pic/browser_demo/science_worker.js /tmp/equation-browser-site/
          cp projects/pic/app/static/likec4-views.js /tmp/equation-browser-site/
          touch /tmp/equation-browser-site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/equation-browser-site
      - id: deployment
        uses: actions/deploy-pages@v4

  deployment-report:
    name: Confirm free Pages publication
    needs: [validate, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record independently verified deployment outcome
        env:
          VALIDATE_STATE: ${{ needs.validate.result }}
          PUBLISH_STATE: ${{ needs.publish.result }}
        run: |
          python - <<'PY'
          import json, os, datetime
          report = {
              "revision": os.environ["GITHUB_SHA"],
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "validation": os.environ["VALIDATE_STATE"],
              "github_pages": os.environ["PUBLISH_STATE"],
              "published": (os.environ["VALIDATE_STATE"] == "success"
                            and os.environ["PUBLISH_STATE"] == "success"),
              "expected_url": "https://maksos1.github.io/EPDE/",
          }
          with open("/tmp/browser-page-published.json","w") as f:
              json.dump(report,f,indent=2)
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          blob=$(git hash-object -w /tmp/browser-page-published.json)
          tree=$(printf '100644 blob %s	deployment.json
' "$blob" | git mktree)
          commit=$(printf 'Browser Pages deployment for %s
' "$GITHUB_SHA" | git commit-tree "$tree")
          git push --force origin "$commit:refs/heads/ci/browser-demo-deployment"
