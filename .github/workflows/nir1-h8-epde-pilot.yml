name: NIR1 | native EPDE multi-initial pilot
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-h8-epde-pilot.yml'
      - 'projects/nir1_stability/nir1/epde_multi_initial.py'
      - 'epde/structure/domain.py'
permissions:
  contents: read
jobs:
  native-search-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        dataset: [nir1_heat, nir1_advdiff]
        arm: [single, multi]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/uv-nir1-native-h8
    steps:
      - name: Checkout research SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install PIC CPU environment
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Validate native EPDE integration at SMOKE budget only (4x1)
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.epde_multi_initial --dataset '${{ matrix.dataset }}' --arm '${{ matrix.arm }}' --seed 0 --output output/native.json
          git rev-parse HEAD > output/revision.txt
      - name: Preserve diagnostic traces even if EPDE fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-h8-epde-smoke-${{ matrix.dataset }}-${{ matrix.arm }}-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
