name: Cross-device Explorer startup checks
on:
  push:
    branches: [demo/streamlit-community-cloud]
    paths:
      - 'run-epde.sh'
      - 'run-epde.cmd'
      - '.devcontainer/**'
      - '.github/workflows/cross-device-launch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher-paths:
    name: Startup commands on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows one-click frontend
        if: runner.os == 'Windows'
        shell: cmd
        run: call run-epde.cmd --check
      - name: Validate macOS / Linux launcher and Codespaces scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n run-epde.sh .devcontainer/setup.sh .devcontainer/start.sh
          bash run-epde.sh --check
      - name: Validate Codespaces configuration and private port
        shell: bash
        run: |
          python -c "import json; x=json.load(open('.devcontainer/devcontainer.json')); assert x['portsAttributes']['8501']['visibility']=='private'; assert 8501 in x['forwardPorts']; print('CODESPACES_CONFIG_PASS')"

  report:
    name: Publish cross-platform launch status
    needs: [launcher-paths]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish aggregated OS matrix result
        env:
          MATRIX_RESULT: ${{ needs.launcher-paths.result }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          success = os.environ["MATRIX_RESULT"] == "success"
          report={"revision":os.environ["GITHUB_SHA"],
                  "run_id":int(os.environ["GITHUB_RUN_ID"]),
                  "os_matrix":["windows-2025","macos-15","ubuntu-24.04"],
                  "result":os.environ["MATRIX_RESULT"],
                  "verified":success,
                  "scope":"launcher file paths and syntax; full Linux scientific browser E2E is a separate job"}
          pathlib.Path("/tmp/epde-run-report.json").write_text(json.dumps(report,indent=2))
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          blob=$(git hash-object -w /tmp/epde-run-report.json)
          tree=$(printf '100644 blob %s\tresult.json\n' "$blob" | git mktree)
          commit=$(printf 'Cross-device EPDE launch report\n' | git commit-tree "$tree")
          git push --force origin "$commit:refs/heads/ci/cross-device-launch"
