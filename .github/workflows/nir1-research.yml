name: NIR1 | immutable sharded research

on:
  push:
    branches: [nir1]
    paths:
      - 'projects/nir1_stability/manifests/launch/*.yaml'

permissions:
  contents: read

concurrency:
  group: nir1-research-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache-nir1
    steps:
      - name: Checkout immutable launch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install isolated CPU dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r projects/nir1_stability/requirements-s0.txt
      - name: Refuse missing or multiple changed launch manifests
        env:
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
        run: |
          git diff --name-only "$BEFORE" "$CURRENT" -- 'projects/nir1_stability/manifests/launch/*.yaml' > changed-launch-paths.txt
          test "$(wc -l < changed-launch-paths.txt)" -eq 1
          test -f "$(head -n 1 changed-launch-paths.txt)"
      - name: Freeze planned identities for all shards
        run: |
          .venv/bin/python -m projects.nir1_stability.nir1.cli plan --launch "$(head -n 1 changed-launch-paths.txt)" --output prepared/planned.json
      - name: Upload immutable ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-ledger-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: prepared/planned.json
          if-no-files-found: error
          retention-days: 30

  shards:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['0', '1', '2', '3']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NIR1_SOFT_DEADLINE_SECONDS: '18000'
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache-nir1
    steps:
      - name: Checkout identical code revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install isolated CPU dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r projects/nir1_stability/requirements-s0.txt
      - name: Download frozen ledger
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nir1-ledger-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: prepared/
      - name: Download previous attempts from the same Actions run
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nir1-results-${{ github.run_id }}-attempt-*-shard-${{ matrix.shard }}
          path: previous/
          merge-multiple: false
      - name: Validate and restore only this shard's earlier verified checkpoints
        run: |
          .venv/bin/python -m projects.nir1_stability.nir1.cli restore --manifest prepared/planned.json --id '${{ matrix.shard }}' --from previous/ --output 'artifacts/shard-${{ matrix.shard }}'
      - name: Execute one bounded shard with per-run atomic checkpoints
        run: |
          .venv/bin/python -m projects.nir1_stability.nir1.cli shard --manifest prepared/planned.json --id '${{ matrix.shard }}' --output 'artifacts/shard-${{ matrix.shard }}'
      - name: Upload every checkpoint (also on algorithm failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-results-${{ github.run_id }}-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [prepare, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache-nir1
    steps:
      - name: Checkout research code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install CPU research dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r projects/nir1_stability/requirements-s0.txt
      - name: Download immutable ledger
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nir1-ledger-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: prepared/
      - name: Download available per-shard evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nir1-results-${{ github.run_id }}-attempt-*
          path: downloaded/
          merge-multiple: false
      - name: Reconcile all planned statuses without silent omissions
        run: |
          .venv/bin/python -m projects.nir1_stability.nir1.cli summarize --manifest prepared/planned.json --records downloaded/ --output aggregated/summary.json
      - name: Preserve reconciled results even if a shard failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-summary-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: aggregated/
          if-no-files-found: warn
          retention-days: 30
