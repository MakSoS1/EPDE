name: NIR1 | full EPDE hotspot profile
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-profile-full.yml'
permissions:
  contents: read
jobs:
  profile-real-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dataset: [ode, burgers]
        variant: [default, nir1_conditional_regulator]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-profile-uv
    steps:
      - name: Checkout exact code revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install locked CPU dependencies
        run: |
          uv sync --project projects/pic --extra cpu --locked
      - name: Profile full original 16x5 search (never use profiled wall time for E1 speed claim)
        run: |
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.profile_full_search --dataset '${{ matrix.dataset }}' --variant '${{ matrix.variant }}' --seed 0 --output artifacts/
          git rev-parse HEAD > artifacts/source-sha.txt
      - name: Keep raw evolutionary results, profile stats, metadata, also on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-prof-full-${{ matrix.dataset }}-${{ matrix.variant }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
