name: NIR1 | H8 native EPDE full quality ablation
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-h8-epde-full.yml'
permissions:
  contents: read
jobs:
  native-full-epde:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [nir1_heat, nir1_advdiff]
        arm: [single, multi]
        seed: [0, 1]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/uv-nir1-h8-full
      NIR1_DISABLE_GRAM_CACHE: '1'
      NIR1_CHI2_PREFIX_CACHE: '0'
    steps:
      - name: Checkout identical scientific source for both arms
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install UV
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install locked isolated CPU PIC dependencies
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Full EPDE 16 by 5 generations, no truth-guided selection
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.epde_multi_initial --dataset '${{ matrix.dataset }}' --arm '${{ matrix.arm }}' --seed '${{ matrix.seed }}' --initial-seed 11 --full --output output/native-full.json
          git rev-parse HEAD > output/revision.txt
          printf '%s\n' 'MULTI arm uses three complete trajectories; single arm one. Search budget is identical, total observed data is NOT identical. H8 full EPDE pilot, not confirmatory S3.' > output/SCIENTIFIC_SCOPE.txt
      - name: Upload every successful or failed original record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-h8-full-${{ matrix.dataset }}-${{ matrix.arm }}-seed${{ matrix.seed }}-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
