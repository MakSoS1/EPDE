name: NIR1 MDL | Audit all 756 original results
on:
  push:
    branches:
      - research/nir1-mdl-factorial-2026-10-14
    paths:
      - '.github/workflows/nir1-mdl-factorial-aggregate.yml'
permissions:
  contents: read
  actions: read
jobs:
  download-verify-analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout analysis script (after all original experimental snapshots)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify analysis-script syntax
        run: python -m py_compile projects/nir1_stability/nir1/mdl_factorial_analyze.py
      - name: Fetch ALL immutable artifacts from 3 completed runs
        run: |
          set -euxo pipefail
          mkdir -p downloaded/seed_0 downloaded/seed_1 downloaded/seed_2
          gh run download 38472631487 --repo "$GH_REPO" --dir downloaded/seed_0
          gh run download 38472636721 --repo "$GH_REPO" --dir downloaded/seed_1
          gh run download 38472639768 --repo "$GH_REPO" --dir downloaded/seed_2
          count=$(find downloaded -name native-full.json -type f | wc -l)
          printf "Downloaded full-search result count: %s\n" "$count"
          test "$count" -eq 756
      - name: Analyze 756 JSONs; compute clustered scientific comparison
        run: |
          python projects/nir1_stability/nir1/mdl_factorial_analyze.py --input downloaded --out audited
          cat audited/REPORT_RU.md
      - name: 'Artifact provenance: checksum all raw JSONs'
        if: always()
        run: |
          mkdir -p audited
          if [ -d downloaded ]; then
            find downloaded -name native-full.json -type f -print0 | sort -z | xargs -0 -r sha256sum > audited/ORIGINAL_RECORD_SHA256SUMS.txt
          fi
          git rev-parse HEAD > audited/ANALYSIS_SOURCE_SHA.txt
      - name: Upload verified final report, comparisons and all identity hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-mdl-causal-756-final-analysis
          path: audited/
          if-no-files-found: error
          retention-days: 90
