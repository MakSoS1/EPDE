name: NIR1 | H12 repaired dynamics full development
on:
  push:
    branches: [nir1]
    paths:
      - '.github/workflows/nir1-h12-full-development.yml'
permissions:
  contents: read
jobs:
  equal-budget-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [nir1_h11_gaussian_heat, nir1_h11_advection_decay, nir1_h11_viscous_burgers, nir1_h11_klein_gordon, nir1_h11_biharmonic, nir1_h11_airy, nir1_h11_shear, nir1_h11_logistic_field, nir1_h11_gauss_reactdiff]
        seed: [0, 1]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      UV_CACHE_DIR: /tmp/nir1-h12-full
      NIR1_DISABLE_GRAM_CACHE: '1'
      NIR1_CHI2_PREFIX_CACHE: '0'
    steps:
      - name: Checkout same version for all H12 cases
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Lock original PIC CPU environment
        run: uv sync --project projects/pic --extra cpu --locked
      - name: Full fixed EPDE budget, 16x5, one equal dataset, seed 0/1
        run: |
          mkdir -p output
          projects/pic/.venv/bin/python -m projects.nir1_stability.nir1.cli epde --dataset '${{ matrix.dataset }}' --variant nir1_dynamic_mdl_repair --seed '${{ matrix.seed }}' --data-seed 0 --output output/native-full.json
          git rev-parse HEAD > output/source-sha.txt
          printf '%s\n' 'H12 target-repair DEVELOPMENT ONLY: same NIR1 H11 physical PDEs have already been inspected. Do not report as independent prospective evidence. All 18 original H11 repair comparisons are made against frozen H11 full run 38133505561. No new data/epochs/individuals; no E1 optimizations. Failures count as failed and originals are retained.' > output/SCIENTIFIC_SCOPE.txt
      - name: Preserve all outcomes including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nir1-h12-full-${{ matrix.dataset }}-seed${{ matrix.seed }}-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
