name: Streamlit native DeepMoD and DISCOVER

on:
  pull_request:
    branches: [demo/streamlit-community-cloud]
  push:
    branches: [feat/streamlit-deepmod-discover, demo/streamlit-community-cloud]
    paths:
      - '.github/workflows/streamlit-native-methods.yml'
      - 'projects/pic/app/**'
      - 'projects/pic/epde_bench/**'
      - 'projects/pic/configs/**'
      - 'projects/pic/tests/**'
      - 'projects/pic/browser_demo/**'
      - 'projects/pic/portable_experiment.py'
      - 'projects/pic/pyproject.toml'
      - 'projects/pic/uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-methods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-requirements:
    name: Four methods with exact Community Cloud requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:projects/pic:projects/pic/app'
      EPDE_TEST_NATIVE_METHODS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install the website requirements independently of uv.lock
        run: |
          uv venv projects/pic/.venv --python 3.12
          # Match pip's selection across the official PyPI and PyTorch indexes.
          uv pip install --python projects/pic/.venv/bin/python \
            --index-strategy unsafe-best-match -r projects/pic/app/requirements.txt pytest
      - name: Run real EPDE, PySINDy, DeepMoD and DISCOVER with the Cloud dependency versions
        run: |
          set -o pipefail
          projects/pic/.venv/bin/python -m pytest -q \
            projects/pic/tests/test_native_pdecomp_methods.py \
            projects/pic/tests/test_native_epde_pysindy_same_env.py \
            projects/pic/tests/test_pdecomp_protocol.py \
            projects/pic/tests/test_library_regressions.py \
            projects/pic/tests/test_viewer_records.py \
            2>&1 | tee "$RUNNER_TEMP/cloud-native-methods.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-cloud-native-methods
          path: ${{ runner.temp }}/cloud-native-methods.log

  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:projects/pic:projects/pic/app'
      EPDE_TEST_NATIVE_METHODS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked CPU app environment
        run: uv sync --project projects/pic --extra cpu --extra app --locked
      - name: Full app and scientific regressions, including actual native NN/RNN training
        run: |
          uv run --project projects/pic --extra cpu --extra app --locked --with pytest python -m pytest -q \
            projects/pic/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        working-directory: projects/pic/browser_demo
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node --check smoke_catalog_restart.mjs
      - name: Start the actual Streamlit app
        run: |
          # A background uv run holds the cache lock until the server exits.
          # Use the synced venv and always stop the server before cache cleanup.
          projects/pic/.venv/bin/python -m streamlit run \
            projects/pic/app/Home.py --server.headless=true --browser.gatherUsageStats=false \
            > /tmp/native-streamlit.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/native-streamlit.pid"
          for attempt in $(seq 1 45); do
            curl --fail --silent http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done
          cat /tmp/native-streamlit.log
          exit 1
      - name: Completed ODE to catalog Navier-Stokes, fresh approval, pinned export and saved history
        working-directory: projects/pic/browser_demo
        run: |
          set -o pipefail
          node smoke_catalog_restart.mjs 2>&1 | tee /tmp/catalog-restart.log
      - name: Four real methods, native queue, results, comparison and desktop/mobile screenshots
        working-directory: projects/pic/browser_demo
        env:
          NATIVE_UI_ALL_METHODS: '1'
        run: |
          set -o pipefail
          node smoke_native_methods.mjs 2>&1 | tee /tmp/native-methods-browser.log
      - name: Stop Streamlit server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/native-streamlit.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/native-streamlit.pid")" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-method-browser-qa
          path: |
            projects/pic/browser_demo/.cache/native-ui/
            projects/pic/browser_demo/.cache/catalog-restart/
            /tmp/native-streamlit.log
            /tmp/catalog-restart.log
            /tmp/native-methods-browser.log
          include-hidden-files: true
          retention-days: 7
