name: Streamlit EPDE Explorer | Scientific regression checks
on:
  push:
    branches: [research/nir1-mdl-factorial-2026-10-14]
    paths:
      - '.github/workflows/nir1-streamlit-postcall-qa.yml'
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONPATH: .:projects/pic:projects/pic/app
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install exact locked application + CPU dependencies
        run: uv sync --project projects/pic --extra cpu --extra app --locked
      - name: Check Python syntax in all changed modules
        run: |
          projects/pic/.venv/bin/python -m compileall -q projects/pic/app projects/pic/epde_bench
          projects/pic/.venv/bin/python -m py_compile projects/pic/tests/test_streamlit_supervisor_20261012.py
      - name: Scientific regression tests for options, bias and pages
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_streamlit_supervisor_20261012.py' -v
      - name: Real tiny EPDE evolution with 1/x coordinate token
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_streamlit_reciprocal_token.py' -v
      - name: Execute real PySINDy baseline through shared benchmark CLI
        run: |
          projects/pic/.venv/bin/python projects/pic/bench.py run ode --variant pysindy --noise 0 --seed 0 --out /tmp/pysindy-demo-record.json
          projects/pic/.venv/bin/python -c 'import json; x=json.load(open("/tmp/pysindy-demo-record.json")); assert x["status"] in ("ok","unsupported"), x'
      - name: Original Streamlit page smoke and equation-comparison tests
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_app.py' -v
      - name: Original interface and benchmark presentation tests
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_app_interfaces.py' -v
      - name: Original input validation tests
        run: |
          projects/pic/.venv/bin/python -m unittest discover -s projects/pic/tests -p 'test_app_inputs.py' -v
