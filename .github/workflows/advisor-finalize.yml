name: Verify and publish the completed advisor release
on:
  push:
    branches: [feat/catboost-advisor-public-results]
    paths: [.github/workflows/advisor-finalize.yml]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:projects/pic:projects/pic/app
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      EPDE_TEST_NATIVE_METHODS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catboost-advisor-public-results
      - uses: actions/download-artifact@v4
        with:
          name: advisor-release-verification
          run-id: 41634115484
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/completed-build
      - name: Restore checksummed completed scientific build
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,tarfile
          path=next(pathlib.Path(os.environ['RUNNER_TEMP'],'completed-build').rglob('advisor-release-sources.tar.gz'))
          assert hashlib.sha256(path.read_bytes()).hexdigest()=='f22ff0e8b6ac3b3b5e9fec3a46f0e8eadba205faecb5008d59a0f21d5460b8d9'
          with tarfile.open(path) as archive:
              members=[m for m in archive.getmembers() if m.isfile() and '__pycache__' not in m.name and not m.name.endswith('.pyc')]
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert m.name.startswith(('projects/pic/','docs/superpowers/','.github/workflows/'))
              archive.extractall('.',members=members,filter='data')
          # Playwright 1.56.1 supports Ubuntu 24.04; latest has moved to 26.04.
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              text=p.read_text()
              if 'playwright' in text or 'browser_demo' in text:
                  p.write_text(text.replace('ubuntu-latest','ubuntu-24.04'))
          # Imported private runs must be visible on the import click itself.
          p=pathlib.Path('projects/pic/app/views/11_Discovery_results.py')
          text=p.read_text();needle='                st.success(f"Imported {len(jobs)}'
          assert needle in text
          p.write_text(text.replace(needle,'                rows = queue.list_jobs(owner)\n'+needle,1))
          p=pathlib.Path('README.md');text=p.read_text()
          text=text.replace('protocol. **Suggested** starts from its profile and adapts resource settings\n   to the input.', 'protocol. **Suggested** uses validated CatBoost recommendations when supported,\n   otherwise transparent input-aware rules.')
          text+='\n### Learned suggestions and public examples\n\nResults and Compare include a read-only Public results collection with three real\nfour-method examples. CatBoost recommendations use numerical signal descriptors\nand whole-equation-family validation, with explicit fallback where the evidence\nor input compatibility is insufficient. See the [model card and complete audit](projects/pic/experiments/advisor_v1/README.md). Visitor results are never published automatically.\n'
          p.write_text(text)
          p=pathlib.Path('projects/pic/README.md');text=p.read_text()
          start=text.index('### Fast, editable starting suggestions');end=text.index('There are no hidden governing-law',start)
          section='''### CatBoost starting suggestions and public examples

          **Suggest settings** ranks a finite portfolio using offline-trained CatBoost
          models, 18 bounded numerical signal/grid descriptors, declared additional
          noise and candidate parameters. Names, reference equations and seed IDs
          are not model features. The complete campaign has 512 real native runs:
          eight scalar 1D PDE datasets, seven families, two noise levels, two seeds
          and four configurations per method. Entire equation families are held out.

          Automatic changes are enabled only where the grouped held-out interval
          supports improvement over Suggested v1 without reduced scoring coverage.
          The current enabled method is native DeepMoD at short initial budgets.
          Unsupported profiles, heavy inputs, full local budgets and out-of-domain
          observations fall back to the existing rules, with a visible explanation.
          This is not a global optimum or an improvement guarantee on arbitrary PDEs.
          See [the model card](experiments/advisor_v1/README.md) and
          [validation report](experiments/advisor_v1/validation.json).

          Suggestions never train scientific models on click. Manual edits persist
          across ordinary reruns and review/back. Explicit reapply invalidates prior
          approval and clears imported configuration YAML. The chosen profile,
          protocol and target are retained. Estimated quality/time are predictions,
          not measured recovery or guaranteed server runtimes.

          **Results -> Public results** opens three immutable educational examples
          with all four native algorithms: Gaussian diffusion, noisy transport and
          noisy advection-diffusion. New visitors can inspect equations, metrics and
          plots without running jobs. **Compare this example** opens shared insights;
          **Try this dataset in Lab** starts a fresh experiment. **My results** is
          separate; private uploads never become public or training data automatically.
          Original outputs, settings, checksums and reconstruction provenance are
          retained. These curated examples are not a representative leaderboard.

          '''
          import textwrap
          p.write_text(text[:start]+textwrap.dedent(section)+text[end:])
          # Use the same browser flow on local Streamlit and an embedded Cloud app.
          p=pathlib.Path('projects/pic/browser_demo/smoke_public_results.mjs');text=p.read_text()
          text=text.replace("const base=process.env.STREAMLIT_URL||'http://127.0.0.1:8501';", "const base=process.env.STREAMLIT_URL||'http://127.0.0.1:8501';\nlet app=page;")
          text=text.replace('page.locator','app.locator').replace('page.getByRole','app.getByRole').replace('page.getByText','app.getByText')
          old="  await page.goto(base+'/Discovery_results');"
          new="""  await page.goto(base+'/Discovery_results',{waitUntil:'domcontentloaded',timeout:60000});
            const until=Date.now()+180000;let ready=false,woken=false;
            while(Date.now()<until&&!ready){
              for(const frame of [...page.frames()].reverse()){
                const wake=frame.getByText('Yes, get this app back up!',{exact:true}).first();
                if(!woken&&await wake.isVisible()){await wake.click();woken=true;}
                const example=frame.getByRole('combobox',{name:'Public example',exact:true});
                const results=frame.getByRole('link',{name:/Results/}).first();
                if(await example.isVisible()||await results.isVisible()){
                  app=frame;
                  if(!await example.isVisible()){await results.click();await settle();}
                  ready=true;break;
                }
              }
              if(!ready)await page.waitForTimeout(1200);
            }
            if(!ready)throw Error('Public Results navigation unavailable');"""
          assert old in text;p.write_text(text.replace(old,new))
          PY
      - name: Add verified regression cases
        run: |
          cat > projects/pic/tests/test_results_import_refresh.py <<'PY'
          """Private ZIP imports are visible without a second click."""
          import io
          from pathlib import Path
          from unittest.mock import patch
          from streamlit.testing.v1 import AppTest
          from support.discovery_lab import job_queue as queue
          from test_portable_handoff import mock_record, archive
          APP=Path(__file__).resolve().parents[1]/'app'
          def test_private_import_is_visible_in_the_same_rerun(tmp_path):
              upload=io.BytesIO(archive([mock_record()]))
              with patch.object(queue,'ROOT',tmp_path), patch('streamlit.file_uploader',return_value=upload):
                  app=AppTest.from_file(str(APP/'Home.py'),default_timeout=60).run()
                  app.session_state['discovery_result_collection']='My results'
                  app.switch_page('views/11_Discovery_results.py').run()
                  assert not app.exception
                  next(b for b in app.button if b.label=='Import these results').click().run()
                  assert not app.exception
                  assert any(m.label=='Experiments' and m.value=='1' for m in app.metric)
                  assert not any('No experiments yet' in n.value for n in app.info)
          PY
          cat >> projects/pic/tests/test_meta_advisor_integration.py <<'PY'

          def test_packaged_deepmod_model_changes_only_allowed_values_on_real_input():
              import json
              from epde_bench.datasets import load
              from support.discovery_lab.meta_advisor.candidates import changes_for, semantic_signature
              root=Path(__file__).resolve().parents[1]
              record=json.loads((root/'public_results/diffusion-deepmod.json').read_text())
              problem=load(record['dataset']);base=record['baseline']['settings'];before=deepcopy(base)
              context=features.enrich_context(starting_settings.summarize_input(
                  record_name=record['dataset'],problem=problem,noise_percent=0),problem=problem)
              report=starting_settings.suggest_settings('deepmod',base,context)
              assert report['learned']['applied']
              assert report['learned']['selected_policy']=='sparse'
              assert len(report['learned']['ranking'])==4
              assert report['settings']['threshold']==.25
              assert semantic_signature('deepmod',base)==semantic_signature('deepmod',report['settings'])
              assert set(changes_for('deepmod',base,report['settings'])) <= {'learning_rate','threshold'}
              assert base==before
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked scientific environment
        run: |
          uv sync --project projects/pic --extra cpu --extra app --locked
          uv pip install --python projects/pic/.venv/bin/python catboost==1.2.8 pytest
      - name: Commit the final reproducible checkout for export tests
        run: |
          git rm .github/advisor-release-0.b64 .github/advisor-release-1.b64 .github/advisor-release-2.b64 .github/advisor-release-3.b64 .github/advisor-followup.b64
          git rm --ignore-unmatch .github/workflows/advisor-workspace.yml .github/workflows/advisor-resume.yml .github/workflows/advisor-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/superpowers projects/pic/README.md projects/pic/app projects/pic/scripts projects/pic/tests projects/pic/browser_demo projects/pic/experiments/advisor_v1 projects/pic/public_results .github/workflows
          git commit -m 'feat(explorer): validated CatBoost suggestions and read-only public scientific results'
      - name: Full native scientific and UI suite
        run: |
          set -o pipefail
          projects/pic/.venv/bin/python -m pytest -q projects/pic/tests 2>&1 | tee "$RUNNER_TEMP/advisor-final-tests.log"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser on supported Ubuntu 24.04
        working-directory: projects/pic/browser_demo
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start real Streamlit
        run: |
          projects/pic/.venv/bin/python -m streamlit run projects/pic/app/Home.py --server.headless=true --browser.gatherUsageStats=false > "$RUNNER_TEMP/advisor-final-streamlit.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/advisor-final-streamlit.pid"
          for n in $(seq 1 45); do
            curl --fail --silent http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/advisor-final-streamlit.log"
          exit 1
      - name: Four real native methods, shared Compare, public examples and mobile
        working-directory: projects/pic/browser_demo
        env:
          NATIVE_UI_ALL_METHODS: '1'
        run: |
          set -o pipefail
          node smoke_catalog_restart.mjs 2>&1 | tee "$RUNNER_TEMP/advisor-final-catalog.log"
          node smoke_native_methods.mjs 2>&1 | tee "$RUNNER_TEMP/advisor-final-four-methods.log"
          node smoke_public_results.mjs 2>&1 | tee "$RUNNER_TEMP/advisor-final-public-results.log"
      - name: Publish verified commit without force
        run: git push origin HEAD:refs/heads/feat/catboost-advisor-public-results
      - name: Stop Streamlit
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/advisor-final-streamlit.pid" ]]; then kill "$(cat "$RUNNER_TEMP/advisor-final-streamlit.pid")" 2>/dev/null || true; fi
      - name: Preserve the exact reviewed sources and commit
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/advisor-final-revision.txt"
          git diff --check > "$RUNNER_TEMP/advisor-final-whitespace.log"
          git archive HEAD --format=tar.gz --output="$RUNNER_TEMP/advisor-final-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisor-final-verification
          path: |
            ${{ runner.temp }}/advisor-final-*.log
            ${{ runner.temp }}/advisor-final-revision.txt
            ${{ runner.temp }}/advisor-final-source.tar.gz
            projects/pic/browser_demo/.cache/public-results/
            projects/pic/browser_demo/.cache/native-ui/
            projects/pic/browser_demo/.cache/catalog-restart/
          include-hidden-files: true
          retention-days: 30
